[paths]
audio_dir      = ~/Documents/Sound2Text/audio
mic_dir        = ~/Documents/Sound2Text/mic
transcript_dir = ~/Documents/Sound2Text/transcript
vocab_file     = ~/Documents/Sound2Text/vocabulary.txt
glossary_file  = ~/Documents/Sound2Text/glossary.txt

[recording]
language     = auto
device       = auto
# モデル指定: tiny / base / small / medium / large-v2 / large-v3 (標準Whisper)
# または models/ フォルダ配下のローカルモデル名
model_size   = small
mode         = meeting
enable_mic   = true
# vocabulary.txt の先頭から何語を Whisper の initial_prompt に渡すか
# (多すぎるとトークン上限を超え逆効果。残りは LLM 校正で利用)
initial_prompt_max_terms = 64
# 音声保存形式: mp3 (推奨・容量92%削減) / wav
audio_format = mp3
# MP3 品質: 0=最高品質 / 2=推奨 / 5=容量優先 (会議録音は2で十分)
mp3_quality  = 2
# エコー除去の感度 (0.0〜1.0): 値が小さいほど積極的にエコー除去
aec_threshold = 0.55

[network]
# 社内プロキシがある場合は設定してください
https_proxy =
http_proxy  =
# 社内プロキシが自己署名証明書を使用している場合は false に設定
ssl_verify  = true

[logging]
# ログファイルの保存先
log_file    = ~/Documents/Sound2Text/sound2txt.log

# ファイルへの書き込みレベル: DEBUG / INFO / WARN / ERROR
# DEBUG = 全ての操作を記録（調査・デバッグ用）
# INFO  = 通常操作のみ記録
log_level   = DEBUG

# 画面表示するカテゴリ (カンマ区切り): REC TR SUM UI SYS
# REC = 録音, TR = 文字起こし, SUM = 纪要, UI = 画面状態, SYS = システム
ui_show     = REC,TR,SUM,UI

# 画面表示する最低レベル: DEBUG / INFO / WARN / ERROR
ui_level    = INFO

[models]
# 言語ごとの優先モデル（models/ フォルダ内のディレクトリ名）
# 空欄の場合は [recording] の model_size を使用する
ja =
zh =
en =

[subtitle]
# VAD 設定
# 文末判定の無音時間（秒）: 無音がこの秒数続いたら文末候補
silence_sec    = 1.5
# 最低蓄積時間（秒）: これ未満は送信しない（Whisper の認識精度に影響）
min_accum_sec  = 1.0
# 最大蓄積時間（秒）: これを超えたら強制送信（小さいほど初回転写が速い）
max_sec        = 12.0

[summary]
corrected_dir = ~/Documents/Sound2Text/corrected
summary_dir   = ~/Documents/Sound2Text/memo
mode          = openai
ollama_url    = http://localhost:11434
ollama_model  = qwen2.5:7b
api_base      = https://api.groq.com/openai/v1
api_key       =
model         = llama-3.3-70b-versatile
