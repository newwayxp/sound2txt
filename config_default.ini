[paths]
audio_dir      = C:\Users\Public\Sound2Text\audio
mic_dir        = C:\Users\Public\Sound2Text\mic
transcript_dir = C:\Users\Public\Sound2Text\transcript
vocab_file     = C:\Users\Public\Sound2Text\corrected\vocabulary.txt

[recording]
record_sec  = 30
language    = auto
device      = auto
model_size  = small
mode        = meeting
enable_mic  = true

[network]
# 社内プロキシがある場合は設定してください
https_proxy =
http_proxy  =
# 社内プロキシが自己署名証明書を使用している場合は false に設定
ssl_verify  = true

[logging]
# ログファイルの保存先
log_file    = C:\Users\Public\Sound2Text\sound2txt.log

# ファイルへの書き込みレベル: DEBUG / INFO / WARN / ERROR
# DEBUG = 全ての操作を記録（調査・デバッグ用）
# INFO  = 通常操作のみ記録
log_level   = DEBUG

# 画面表示するカテゴリ (カンマ区切り): REC TR SUM UI SYS
# REC = 録音, TR = 文字起こし, SUM = 纪要, UI = 画面状態, SYS = システム
ui_show     = REC,TR,SUM,UI

# 画面表示する最低レベル: DEBUG / INFO / WARN / ERROR
ui_level    = INFO

[subtitle]
# 字幕機能の設定
# モデル: CPU では tiny (高速) / small (推奨) のみ使用可能
model_size     = small
# 認識言語: auto / zh / ja / en
src_lang       = auto
# 表示言語: 空欄=元の言語のまま / zh / ja / en （異なる場合は翻訳）
dst_lang       =
# VAD 振幅閾値（小さいほど小さな音でも検出）
vad_threshold  = 400
# 文末判定の無音時間（秒）
silence_sec    = 0.8
# 最大文長（秒）
max_sec        = 12.0
# 字幕クリアまでの無音時間（秒）
clear_sec      = 3.0

[summary]
corrected_dir = C:\Users\Public\Sound2Text\corrected
summary_dir   = C:\Users\Public\Sound2Text\memo
mode          = openai
ollama_url    = http://localhost:11434
ollama_model  = qwen2.5:7b
api_base      = https://api.groq.com/openai/v1
api_key       =
model         = llama-3.3-70b-versatile
